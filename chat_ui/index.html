<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ctrl-agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <div id="output">
      <div id="boot">ctrl-agent — type 'help' for commands, 'clear' to reset</div>
      <div id="thinking">...</div>
    </div>

    <div id="prompt-line">
      <span id="prompt-prefix">$ </span>
      <textarea
        id="input"
        rows="1"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
    </div>

  </div>

  <script src="chat.js"></script>
</body>
</html>
