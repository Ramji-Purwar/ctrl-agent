<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0e0e0e;
      --surface:    #161616;
      --border:     #2a2a2a;
      --accent:     #00e5a0;
      --accent-dim: #00e5a022;
      --user-bg:    #1e1e1e;
      --agent-bg:   #131713;
      --text:       #e2e2e2;
      --muted:      #666;
      --error:      #ff5f5f;
      --tool-bg:    #0d1a14;
      --tool-text:  #00b37a;
      --radius:     10px;
      --font-ui:    'IBM Plex Sans', sans-serif;
      --font-mono:  'IBM Plex Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ───────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
    }

    /* ── Header ───────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #header h1 {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #header .status {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Message list ─────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Message bubbles ──────────────────────────────────── */
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeUp 0.18s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user  { align-self: flex-end; align-items: flex-end; }
    .msg.agent { align-self: flex-start; align-items: flex-start; }

    .msg .label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .msg.user .label  { color: var(--accent); }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg.user  .bubble {
      background: var(--user-bg);
      border: 1px solid var(--border);
    }

    .msg.agent .bubble {
      background: var(--agent-bg);
      border: 1px solid #1e2b22;
    }

    .msg.error .bubble {
      background: #1a0f0f;
      border: 1px solid #3a1a1a;
      color: var(--error);
    }

    /* ── Tool trace ───────────────────────────────────────── */
    .tool-trace {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .tool-trace summary {
      color: var(--tool-text);
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tool-trace summary::before {
      content: "▸";
      font-size: 10px;
      transition: transform 0.15s;
    }

    .tool-trace[open] summary::before {
      transform: rotate(90deg);
    }

    .tool-trace summary::-webkit-details-marker { display: none; }

    .tool-trace .tools-list {
      margin-top: 5px;
      padding: 8px 10px;
      background: var(--tool-bg);
      border: 1px solid #1a2e20;
      border-radius: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tool-tag {
      background: #0a1f15;
      border: 1px solid #1e3d28;
      color: var(--tool-text);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    /* ── Typing indicator ─────────────────────────────────── */
    #typing {
      display: none;
      align-self: flex-start;
      padding: 10px 15px;
      background: var(--agent-bg);
      border: 1px solid #1e2b22;
      border-radius: var(--radius);
      gap: 5px;
      align-items: center;
    }

    #typing.visible { display: flex; }

    #typing span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.3;
      animation: blink 1.2s ease-in-out infinite;
    }

    #typing span:nth-child(2) { animation-delay: 0.2s; }
    #typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40%            { opacity: 1; }
    }

    /* ── Input bar ────────────────────────────────────────── */
    #input-bar {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
      overflow-y: auto;
    }

    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }

    #send-btn:hover:not(:disabled) { opacity: 0.85; }
    #send-btn:active:not(:disabled) { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #send-btn svg { display: block; }

    #clear-btn {
      background: var(--border);
      border: none;
      border-radius: var(--radius);
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
      color: var(--muted);
      font-size: 16px;
    }

    #clear-btn:hover:not(:disabled) { opacity: 0.85; background: #333; }
    #clear-btn:active:not(:disabled) { transform: scale(0.94); }
    #clear-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Empty state ──────────────────────────────────────── */
    #empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      pointer-events: none;
      user-select: none;
    }

    #empty .big { font-size: 28px; }
    #empty p {
      font-family: var(--font-mono);
      font-size: 12px;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="app">

    <div id="header">
      <div class="dot"></div>
      <h1>AI Agent</h1>
      <span class="status" id="status-text">ready</span>
    </div>

    <div id="messages">
      <div id="empty">
        <div class="big">⌘</div>
        <p>Ask me anything.<br/>git · files · coming soon: gmail</p>
      </div>
      <div id="typing">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="input-bar">
      <textarea
        id="input"
        rows="1"
        placeholder="Type a message…"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button id="send-btn" title="Send (Enter)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 8L14 8M14 8L9 3M14 8L9 13" stroke="#0e0e0e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="clear-btn" title="Clear chat history">✕</button>
    </div>

  </div>
  <script src="chat.js"></script>
</body>
</html>
